,"q":"Is there a costal spot present in forewing underside space 10?","c":"Yes — costal spot present in FW space 10 (A. sublustris)","src":"override"},{"qn":79,"q":"Is there a whitish streak on the hindwing underside running from the base of the dorsum to the apex?","c":"No — no whitish streak","src":"canonical"},{"qn":80,"q":"Do both the forewing and hindwing have a distinctly paler subapical area, irrorated (sprinkled) with whitish scales?","c":"No — subapical area not distinctly paler on both wings","src":"canonical"},{"qn":81,"q":"Is the underside ground colour pale grey-brown — distinctly paler than the typical hair-brown Arhopala underside — with the hindwing spaces 4–5 spots and end-cell bar pale and low-contrast (each ringed by a black border, then a white outer ring), while the forewing postdiscal band remains strongly dark and contrasts sharply against the pale ground?","c":"No — typical hair-brown underside; spots solid, darker than the ground colour","src":"canonical"},{"qn":82,"q":"On the hindwing underside, is the postdiscal spot in space 6 positioned roughly midway between the postdiscal spot in space 5 and the end-cell bar?","c":"No — spot 6 displaced past midway; touching or overlapping the end-cell bar; spots 5, 6 and 7 widely out of line","src":"override"},{"qn":83,"q":"Is this a small species with spots above the forewing cell and a spot at the base of forewing space 3?","c":"No","src":"canonical"},{"qn":88,"q":"On the forewing underside, is the basal half of space 1b completely darkened?","c":"No — basal half of FW space 1b not completely darkened","src":"canonical"}],"Arhopala zylda elioti":[{"qn":1,"q":"Does the hindwing have a tail?","c":"No — hindwing is tailless","src":"canonical"},{"qn":22,"q":"Is there a restricted dark patch in FW space 1b (under the forewing cell), bounded outwardly by a pale line?","c":"No — no dark patch present in FW space 1b","src":"canonical"},{"qn":27,"q":"Is the forewing postdiscal band incomplete, ending at vein 7 (no spot 9)?","c":"No — FW postdiscal band complete (or only partially dislocated at vein 4)","src":"canonical"},{"qn":92,"q":"Are the underside markings almost entirely suppressed — the postdiscal spots replaced by a faint, obscure streak rather than a series of distinct separate spots, with most other typical markings absent?","c":"No — postdiscal spots distinct; typical markings present","src":"canonical"},{"qn":93,"q":"Does the hindwing have a very rounded tornus, and are tornal green scales absent?","c":"No","src":"canonical"},{"qn":94,"q":"Is there a prominent yellowish area in the centre of the hindwing underside, and are the underside markings generally obscure or ill-defined?","c":"No — HW discal area not prominently yellowish; markings well-defined","src":"canonical"},{"qn":95,"q":"Is there a small spot at the extreme base of hindwing space 6 on the underside?","c":"No","src":"canonical"},{"qn":97,"q":"Are the underside spots prominent and rounded, with a central spot in FW space 11?","c":"No","src":"canonical"},{"qn":100,"q":"In the hindwing underside spaces 2 - 5, are the submarginal spots prominently wedge-shaped (∧), black or dark brown?","c":"No — HW submarginal spots not wedge-shaped (uniform in size and colour)","src":"canonical"},{"qn":101,"q":"On the hindwing underside, what best describes the position of postdiscal spot 6 relative to the postdiscal row and the end-cell bar?","c":"Not displaced / Slightly displaced — spot 6 roughly level with spot 5, or only minimally shifted inward; spots 5, 6 and 7 broadly in line","src":"canonical"},{"qn":102,"q":"Is the HW postdiscal band at vein 2 fully separated into two distinct portions — a clear gap visible between them?","c":"No — HW postdiscal band continuous or not clearly separated at vein 2","src":"canonical"},{"qn":106,"q":"Do hindwing postdiscal spots 5, 6, and 7 overlap with their centres forming a straight line (echelon arrangement)?","c":"Yes — HW spots 5, 6, and 7 in echelon (centres in straight line)","src":"canonical"},{"qn":107,"q":"Within the amphimuta group (echelon HW spots 5–7), which subgroup best fits the specimen?","c":"Spots rounded; tailless — cilia may be prolonged but no distinct tail at vein 2","src":"canonical"},{"qn":114,"q":"On the forewing underside, is the basal cell spot absent?","c":"No — basal cell spot present on FW underside","src":"canonical"},{"qn":115,"q":"Is there a distinct white patch on the hindwing cilia just above the tornal lobe?","c":"No — no white patch just above the tornal lobe","src":"canonical"},{"qn":116,"q":"Is the specimen from Borneo (not the Malay Peninsula)?","c":"No — Malay Peninsula specimen","src":"canonical"},{"qn":119,"q":"What is the male's overall upperside colour?","c":"Violet-blue or violet-purple — clear warm or violet tone (A. amphimuta / A. zylda / A. moolaiana / A. sceva)","src":"canonical"},{"qn":122,"q":"Is the male's black border reduced to a thread (very narrow, well under 0.5 mm)?","c":"No — border regular ~0.5 mm","src":"canonical"},{"qn":123,"q":"On the hindwing underside, is there a very weak tooth at vein 2 (hindwing postdiscal band only partially dislocated at vein 2), and are the postdiscal spots more rounded or less rounded (more angular, like [A. norda](https://www.inaturalist.org/observations?verifiable=true&taxon_id=887831&preferred_place_id=6734))?","c":"No — no weak tooth at vein 2 (underside like A. major/A. moolaiana, separated by upperside)","src":"override"},{"qn":124,"q":"Is the hindwing underside postdiscal series dislocated at vein 2, and is the species noticeably smaller than its allies?","c":"No — HW band not strongly dislocated at vein 2","src":"canonical"},{"qn":125,"q":"Is the male a warm violet-purple (with a reddish hue rather than blue), and is the FW postdiscal spot in space 3 an oblique oval?","c":"No — violet-blue (not warm purple); smaller (FW 16–17 mm); female exceptionally narrow-bordered","src":"canonical"},{"qn":126,"q":"What is the forewing length, and are the hindwing cilia prolonged into a short tooth at vein 2?","c":"Smaller (FW ~16–17 mm); HW cilia evenly rounded, no tooth at vein 2","src":"override"}],"Ganesa group — ariel or elizabethae (unresolved)":[{"qn":1,"q":"Does the hindwing have a tail?","c":"Yes — hindwing is tailed","src":"canonical"},{"qn":2,"q":"Are the underside markings incomplete — lacking basal/central cell spots on the forewing and various basal/discal spots on the hindwing, with a narrow postdiscal band?","c":"No — complete underside markings","src":"canonical"},{"qn":3,"q":"Are the cell spots on the forewing underside outlined in greenish silver?","c":"No — no silver outlines","src":"canonical"},{"qn":7,"q":"Are the underside markings macular — composed of separated lines and dots rather than continuous solid bands?","c":"No — markings form more continuous bands","src":"canonical"},{"qn":9,"q":"Is the tail located at vein 3 and short?","c":"No — tail at the usual vein 2 (typical position)","src":"canonical"},{"qn":11,"q":"In hindwing underside spaces 4 and 5, are the submarginal spots prominently black and wedge-shaped (∧), with the postdiscal spots large and edged by a thick, pale border?","c":"No — HW spaces 4–5 submarginal spots not wedge-shaped, or postdiscal spots not thickly pale-bordered","src":"canonical"},{"qn":12,"q":"Is the tail very long and thread-like — approximately 5 mm or longer?","c":"No — tail moderate or typical for Arhopala (up to ~4 mm)","src":"canonical"},{"qn":22,"q":"Is there a restricted dark patch in FW space 1b (under the forewing cell), bounded outwardly by a pale line?","c":"No — no dark patch present in FW space 1b","src":"canonical"},{"qn":79,"q":"Is there a whitish streak on the hindwing underside running from the base of the dorsum to the apex?","c":"No — no whitish streak","src":"canonical"},{"qn":80,"q":"Do both the forewing and hindwing have a distinctly paler subapical area, irrorated (sprinkled) with whitish scales?","c":"No — subapical area not disti const NOTES = {"Alea subgroup — normani or sublustris (unresolved)":"⚠ Cannot distinguish to species without male upperside sheen and colour.\n\n[A. normani](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1340249&preferred_place_id=6734): male less shining, more violet than bright blue.\n\n[A. sublustris ridleyi](https://www.inaturalist.org/observations?verifiable=true&taxon_id=475916&preferred_place_id=6734) (Ridley's Oakblue): male bright glistening blue; borders under 0.5 mm.\n\n⚠ Note: both species may also require male genitalia dissection for definitive identification. Inspect male upperside sheen to differentiate.","Alea subgroup — phaenops / normani / sublustris (unresolved)":"⚠ Cannot determine to species without male border pattern.\n\n[A. phaenops sandakani](https://www.inaturalist.org/observations?verifiable=true&taxon_id=887006&preferred_place_id=6734): male border expands notably toward apex; HW spot 6 does not overlap end-cell bar.\n\n[A. normani](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1340249&preferred_place_id=6734): male less shining, more violet than blue; borders narrow. ⚠ Requires genitalia dissection to confirm vs sublustris.\n\n[A. sublustris ridleyi](https://www.inaturalist.org/observations?verifiable=true&taxon_id=475916&preferred_place_id=6734): bright glistening blue; borders under 0.5 mm. ⚠ Requires genitalia dissection to confirm vs normani.\n\nInspect the male upperside border width and sheen to narrow further.","Arhopala abseus":"Underside markings much darkened — most spots blackish brown. Forewing underside: costal spot in space 12; two spots each in spaces 9, 10, and 11. Hindwing: spot in middle of space 7 outlined in whitish. Male upperside: deep lustrous violet blue; FW black border expands from 2.0 mm at tornus to 4.0 mm at apex. Female: shining blue with wider borders.","Arhopala ace ace":"Underside: all markings relatively wide; FW postdiscal band dislocated at vein 4; HW postdiscal spot 6 outwardly concave. Male: deep cobalt blue with black border reduced to a thread. Female: purple.","Arhopala achelous achelous":"Tailed. FW 22 mm. Underside: strong purple tinge (nominate); no spots in FW space 11; single spot at base of HW space 8. Lacks spots in FW space 11 (cf. [A. anthelus](https://www.inaturalist.org/observations?verifiable=true&taxon_id=149211&preferred_place_id=6734)); single spot at base of HW space 8 (cf. two in [A. anthelus](https://www.inaturalist.org/observations?verifiable=true&taxon_id=149211&preferred_place_id=6734)). HW postdiscal spots 5, 6 and 7 in the normal echelon arrangement, spot 6 nearer to spot 5 than to the end-cell bar. Subspecies [A. achelous malu](https://www.inaturalist.org/observations?verifiable=true&taxon_id=940963&preferred_place_id=6734) (Kedawi: Langkawi, Perlis, north Kedah) lacks most of the purple tinge found in the nominate. Male: shining dark blue, narrow ~0.5 mm black border. Achelous subgroup.","Arhopala acta":"HW tail ~3 mm. Spot 6 displaced past midway, touching or overlapping end-cell bar; spots 5, 6 and 7 widely out of line. Spot 6 outer edge outwardly straight. Underside markings very faint. No costal spot in FW space 10. FW apex rounded. Male: blue/violet (not green).","Arhopala aedias":"Underside ground colour hair brown; spots narrowly outlined in pale buff lines. Male upperside: lustrous violet blue with black border reduced to a thread. Female upperside: purple blue with typical broad black borders. Two size forms occur: large (FW 25–29 mm) and small (FW 20–22 mm; small form has more rounded, darker spots beneath). Two subspecies: [A. aedias agnis](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498179&preferred_place_id=6734) (forest at low to moderate elevations, standard) and [A. aedias meritatas](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498179&preferred_place_id=6734) (Langkawi Islands — paler and brighter blue upperside in both sexes).","Arhopala agaba":"Agaba subgroup of the cleander group — distinctive and unique. Underside pale purple-brown with dark markings; the subapical area of both wings is irrorated (sprinkled) with whitish scales, appearing noticeably paler than the rest of the wing. HW postdiscal spots 7, 6 and 5 widely out of line: the inner edge of spot 6 is in line with or inside the inner edge of spot 7, and spot 6 touches or overlaps the end-cell bar; spot 5 is almost always contiguous or amalgamated with the end-cell bar. The HW postdiscal band is only PARTIALLY dislocated at vein 2 — all other cleander group members have it completely dislocated. Tail filamentous at vein 2. Male: shining violet-blue with a black border ~1.0 mm wide. Female: brighter blue with broader black borders.","Arhopala agelastus agelastus":"Underside: HW postdiscal spot in space 3 is almost in line with spots in spaces 2 and 4 (distinguishes female from allied species). Male: violet blue with FW border 1.0 mm at tornus to 4.0 mm at apex. Female: brighter blue with broader borders. Tailless.","Arhopala agesias":"Tailless. The most common species in the group. Underside: hair-brown ground colour with all markings as rounded spots; single central spot in FW space 11.","Arhopala agesilaus gesa":"Tailless. FW underside has a basal cell spot. Male: rich violet blue; FW black border 2.0 mm at tornus expanding to 4.0 mm at apex. Female: bluer shade than male. Superficially resembles a small [Arhopala major](https://www.inaturalist.org/observations?verifiable=true&taxon_id=429756&preferred_place_id=6734).","Arhopala agrata agrata":"Underside markings faint. FW: postdiscal spot in space 9 absent or very obscure; no costal spot in space 10. HW: postdiscal spot 6 considerably wider than spot 7. Male: dark purplish blue with black border reduced to a thread. Female: bright blue to purple-blue; HW blue reaches the termen between vein endings.","Arhopala aida":"Underside paler brown. Nominate subspecies ([A. aida aida](https://www.inaturalist.org/observations?verifiable=true&taxon_id=880740&preferred_place_id=6734)): slatey grey glaze — strong in Langkawi specimens, weaker through the rest of the Malay Peninsula. [A. aida ophir](https://www.inaturalist.org/observations?verifiable=true&taxon_id=880740&preferred_place_id=6734) (Mt. Ophir): pale purple glaze instead.\n\nFW: no basal spot in space 10; costal spot in mid-space 11; postdiscal spot 4 shifted distad out of line with spots 5 and 6; termen straight and more produced than other alitaeus-group members. HW: postdiscal spot 6 outwardly straight or convex; postdiscal band completely dislocated at vein 2. Male: black borders relatively broad, expanding from ~1.25 mm at tornus to ~2.0 mm at apex. Tail ~3.5–4.0 mm. FW 16.0–19.0 mm.","Arhopala alaconia media":"Alesia subgroup (agelastus group) — the long-established Malayan member of this subgroup, and (per field-photo review) the only Malayan agelastus-group species that genuinely has a concave/sinuous HW spot 6 paired with enlarged submarginal spots; [A. alesia sacharja](https://www.inaturalist.org/search?q=Arhopala+alesia), despite older literature placing it in the same subgroup, actually has a convex spot 6 touching the end-cell bar and uniform (not enlarged) submarginal spots — see notebook correction. Distinctive early-exit character (per field-photo review): hindwing underside spaces 4–5 submarginal spots prominently black and wedge-shaped (∧), with the postdiscal spots large and edged by a thick, pale border — unique to this species among Malaysian Arhopala. Underside: inner submarginal spots in FW spaces 2–3 and HW spaces 4–5 notably enlarged and darkened; HW postdiscal spot 6 outwardly concave or sinuous; tornal green scales present on the hindwing; small spot often at base of FW space 3. This is the normal tailless form (slightly toothed); see Arhopala alaconia media f. kempi for the rarer tailed form (~2.5 mm tail at vein 2), which is reached directly in the tailed branch via this same wedge-shaped submarginal-spot character. Both sexes alike: violet blue with FW border 3.0 mm at tornus expanding to mid-costa.","Arhopala alaconia media f. kempi":"Alesia subgroup (agelastus group) — the rarer tailed form (f. kempi, ~2.5 mm tail at vein 2) of Arhopala alaconia media; though described as rare in the literature, it is reportedly encountered fairly often in the field. Same diagnostic characters as the tailless form: hindwing underside spaces 4–5 submarginal spots prominently black and wedge-shaped (∧), with the postdiscal spots large and edged by a thick, pale border — unique to this species among Malaysian Arhopala; inner submarginal spots in FW spaces 2–3 and HW spaces 4–5 notably enlarged and darkened; HW postdiscal spot 6 outwardly concave or sinuous; tornal green scales present on the hindwing; small spot often at base of FW space 3. Both sexes alike: violet blue with FW border 3.0 mm at tornus expanding to mid-costa.","Arhopala alesia sacharja":"Agelastus group, alongside [A. barami penanga](https://www.inaturalist.org/observations?verifiable=true&taxon_id=958932&preferred_place_id=6734) one of only two tailed exceptions in the otherwise-tailless group. Tail at the usual vein 2 position (not the unusual short white-tipped vein-3 tail of the abseus group). A very rare, late Malayan record (first found in Langkawi in 1994; also distributed across NE India, Myanmar, Thailand, Laos, and Vietnam). Underside (per field-photo review, correcting older literature that described a concave spot 6 and enlarged submarginal spots — see notebook correction): ground colour pale grey-brown, distinctly paler than the typical hair-brown Arhopala underside — a useful early-exit character, since its only close rival A. barami penanga has a typical hair-brown underside with solid spots darker than the ground colour; FW postdiscal band almost entirely dark/black, strongly contrasting against the pale ground colour, continuous, often with a small spot at the base of FW space 3; HW postdiscal band only slightly dislocated at vein 2 (shifted but still touching); inner submarginal spots in HW spaces 4–5 and the end-cell bar very pale, close to the ground colour with little contrast, each ringed by a black border and then a white outer ring; HW postdiscal spot 6 outwardly convex, touching or overlapping the end-cell bar, spots 5/6/7 widely out of line — effectively identical to A. barami penanga here. Separated from A. barami penanga by being smaller, with a more moderate male FW border (~3.0 mm at tornus, not reaching barami's extreme 8.0 mm at costa). Sexes alike: violet blue.","Arhopala alica":"Tailless. Bornean endemic. Male: dark, dull purple with a thread-like black border; FW ~17 mm. Female: purple with broad black borders (contrasts sharply with [A. moolaiana](https://www.inaturalist.org/observations?verifiable=true&taxon_id=549326&preferred_place_id=6734) female). HW postdiscal band only partially dislocated at vein 2. Distinguished from [A. moolaiana](https://www.inaturalist.org/observations?verifiable=true&taxon_id=549326&preferred_place_id=6734) by: darker/duller male colour, smaller size, broader female borders, and Bornean range.","Arhopala alitaeus":"Underside markings notably annular (ring-like); FW postdiscal spot in space 1b often dislocated outward from spot in space 2. FW: basal spot present in space 10. Male: regular black borders ≥1.0 mm wide. Tail ~3.5–4.0 mm.","Arhopala allata pandora":"Tailed at vein 2. FW ~22 mm. FW apex acute; termen straight between veins 2–4. Underside postdiscal band sinuous or only slightly dislocated at vein 4; HW postdiscal spots narrow, regular, rectangular. Male: dark purple; FW border 0.5 mm at tornus expanding to 1.5 mm at apex. Female: dark shining blue. Rare; recorded from NE India to Neomalaya and Philippines. HW postdiscal spots 5, 6 and 7 in echelon, spot 6 nearer to spot 5 than the end-cell bar. (2026-06-19 fix: the echelon question previously routed here only via a false 'spot 6 directly below spot 7' shortcut, which would have misidentified a truthfully-answered specimen by sending it toward A. delta / A. atosia. The tree now checks FW apex/termen shape and HW spot 6–7 shape right after the echelon answer, so the canonical path matches the true echelon answer above.)","Arhopala amantes":"Keyed here due to similar silvery FW cell markings, but technically outside the centaurus group. FW ~27 mm. Male: shining blue, very broad borders — 3.0 mm at tornus expanding to 5.0 mm at apex. Female: lighter blue. Underside: FW postdiscal spot in space 4 shifted distad (outwards), out of line with the spots above and below it; FW postdiscal band continuous elsewhere; lacks costal spot in FW space 10; dark patch under the cell in the upper part of space 1a extends all the way to the postdiscal band. Range: South Myanmar.","Arhopala ammon ammon":"Tornal green scales present. Underside HW: spot 6 extended to base of space; outer and central spots in space 7 separate, gap whitened. Upperside male: dark blue, narrow borders (1.5 mm at FW apex). Female: narrow borders (2.0 mm at FW tornus and HW).","Arhopala ammonides chunsu":"No tornal green scales. Underside HW: gap between outer and central spots in space 7 completely whitened (no quadrate mid-cell white patch). Upperside: powdery blue with very broad borders on all wings; female with dark bar at FW end-cell.","Arhopala amphimuta amphimuta":"Tailless. Male: dark bluish-purple with a regular 0.5–1.0 mm black border; FW 20–23 mm. HW cilia often prolonged into a very short tooth at vein 2 (may be inconspicuous in worn specimens). FW underside: postdiscal band slightly dislocated at vein 4; spot in space 3 usually an oblique oval. Female: lighter purple with typical broad black borders. HW postdiscal band only partially dislocated at vein 2 (as in [A. zylda](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1340244&preferred_place_id=6734)).","Arhopala anarte":"Tailed. One of the most beautiful and largest species in the genus. Immediately recognized by the central spot in FW underside space 11 (no other camdeo subgroup member has this). Male: shining pale silvery blue overlaid with violet toward the margins. Camdeo subgroup.","Arhopala anella":"Considerably larger than [A. abseus](https://www.inaturalist.org/observations?verifiable=true&taxon_id=333427&preferred_place_id=6734). Underside ground colour hair brown; markings not prominently darkened; no spot in FW space 12. Male upperside: blue restricted to basal halves of FW spaces 1b, 2, and 3 and the lower half of the cell; HW blue confined almost entirely to the cell; very wide fuscous borders. Female: relatively narrow black borders.","Arhopala anthelus grahami":"One of the most beautiful in the genus. FW 28 mm. Underside: ≥3 spots in FW space 11; 2 spots at base of HW space 8; spots on FW and upper HW half deep purple-brown. Male: brilliant shining blue, narrow black border. Female: violet-blue with fairly broad black borders. Anthelus subgroup.","Arhopala antimuta antimuta":"The most abundant species in the amphimuta group. Tailless. FW ~16.0 mm. Male: deep violet-blue; black border reduced to a thread. HW underside: postdiscal band completely dislocated at vein 2 (though this character can sometimes be inconstant — cf. [A. arvina adalitas](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1294761&preferred_place_id=6734), in which it is only partially dislocated); postdiscal spot 6 positioned directly below spot 7, displaced well past the postdiscal row — touching or overlapping the end-cell bar; spots 5, 6 and 7 widely out of line. FW postdiscal spots 2 and 3 are in line (perimuta subgroup). Confirmatory: male upperside uniformly coloured — no contrasting wing colour as in [A. metamuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1340245&preferred_place_id=6734).","Arhopala araxes":"FW ~27 mm. HW with a distinct tornal lobe (unlike [A. centaurus](https://www.inaturalist.org/observations?verifiable=true&taxon_id=146903&preferred_place_id=6734)). Male: shining blue with violet tinge toward apices; FW border a thread at tornus, increasing to 1.0 mm at apex. Female: blue. Range: Sumatra to Sulawesi region. Underside: FW cell spots outlined in greenish silver; costal spot present in FW space 10 (also present in A. centaurus nakula).","Arhopala ariana":"Underside dark brown with a faint purplish wash. FW: no basal spot in space 10; postdiscal spot in space 4 shifted distad out of line. Male: border 1.0–1.5 mm, slightly wider at apex. Tail ~3.5–4.0 mm.","Arhopala arianaga":"Underside markings slightly darker than ground colour with a very faint pinkish glaze. FW: no basal spot in space 10; FW length 21.0–22.0 mm (distinctly larger than A. elopura, FW 17.0–19.0 mm). HW: postdiscal space 6 entirely blue. Male: black border reduced to a thread. Tail ~3.5–4.0 mm.","Arhopala ariel":"No whitened gap between HW space 7 spots; no mid-cell whitish patch. Tornal green scales present; HW spot 6 normal. Upperside male: bluish-purple, hardly shining; FW border 1.5 mm at tornus expanding to 4.0 mm at apex. Female: bluer shade with broader borders.","Arhopala aroa aroa":"Alea subgroup. Recognizable by its rounded, elongate wings (distinctive wing shape). Narrow postdiscal bands that are well clear of the submarginal lunules. Smaller species (FW < 21 mm).","Arhopala arvina adalitas":"Tailless. FW ~18.0 mm — slightly larger than [A. antimuta antimuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498184&preferred_place_id=6734) (FW ~16.0 mm). Underside ground colour hair-brown; tornal green scales present. Male: darker blue than [A. buddha](https://www.inaturalist.org/observations?verifiable=true&taxon_id=885913&preferred_place_id=6734); black border reduced to a thread. Female: purple-blue. HW postdiscal band only partially dislocated at vein 2 (cf. [A. antimuta antimuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498184&preferred_place_id=6734), where it is completely dislocated at vein 2, though that character can sometimes be inconstant). HW postdiscal spots 5, 6 and 7 widely out of line; inner edge of spot 6 in line with or inside the inner edge of spot 7; spot 6 touches or overlaps the end-cell bar; outer edge of spot 6 outwardly sinuous or concave. Normally has a costal spot in FW space 10, above the end-cell bar. (2026-06-20 fix: the spot-6-displacement and vein-2-dislocation questions previously routed here only via false answers that contradicted these true features, which would have misidentified a truthfully-answered specimen into the muta/agelastus/agesilaus groups instead. The tree now checks for arvina adalitas's sinuous/concave spot 6 + FW space 10 costal spot right after the true 'touching/overlapping' and 'partially dislocated' answers, so the canonical path matches the true answers above.)","Arhopala athada athada":"FW postdiscal spot 9 narrower than spot 6, shifted basad. HW postdiscal spot 6 fills the gap between spot 5 and the end-cell bar. Large species (FW > 21 mm); conspicuously projecting HW tornal lobe.","Arhopala atosia malayana":"Underside ground colour uniform hair brown; markings less defined and paler than the closely related [A. lurida](https://www.inaturalist.org/observations?verifiable=true&taxon_id=475784&preferred_place_id=6734) (whose markings are darker and more sharply defined), contrasting feebly/weakly with the ground colour. HW postdiscal spot 6 positioned roughly midway between spot 5 and the end-cell bar; spots 5, 6 and 7 in echelon, their centres broadly in line. Filamentous tail at vein 2, ~2.5 mm — distinguishing it from the tailless [A. epimuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=429757&preferred_place_id=6734). FW ~22.0 mm. Male FW upperside: thread-width black border; discal patch large and circular, extending widely into the cell and space 1b.","Arhopala aurea":"Tailed. Tail short and stout, just under 2.0 mm. Underside hair-brown with complete markings. FW postdiscal spot 4 shifted distad, out of line with spots 5 and 6; dark patch in FW space 1b not solid. HW postdiscal band partially dislocated at vein 2; postdiscal spot 6 widely out of line with spots 5 and 7 — inner edge of spot 6 in line with, or inside, the inner edge of spot 7; spot 6 touches or overlaps the end-cell bar. Male: HW cell considerably longer than half the wing; shining green with weak blue suffusion at wing bases; FW border 0.75–1.5 mm at tornus, decreasing to a thread above vein 3 or 4; HW green does not reach the termen. Female: blue to purple-blue with a relatively narrow HW border.","Arhopala aurelia":"Alea subgroup. Distinctive underside: pale slatey purple with conspicuous dark markings outlined by nearly-white striae. HW postdiscal spot 6 displaced past midway, touching or overlapping the end-cell bar (spots 5, 6 and 7 widely out of line). Smaller species (FW < 21 mm); less conspicuous HW tornal lobe.","Arhopala avatha":"Tailless. Uniquely lacks the basal cell spot on FW underside. Male: very dark bluish violet; FW black border 1.0 mm at tornus increasing to 2.0 mm at apex (narrow borders). Female: purple. Similar to [Arhopala antimuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498184&preferred_place_id=6734) but distinguished by wider borders in the male.","Arhopala avathina avathina":"Tailless. Distinctive: FW underside lacks a basal cell spot (absent, not obscure). HW postdiscal band completely dislocated at vein 2. Otherwise similar to other amphimuta subgroup members.","Arhopala azinis azinis":"Underside: FW postdiscal band sinuous or only slightly dislocated at vein 4; HW postdiscal spot 6 outwardly straight or convex. Male: dark blue with broad black borders (2.0 mm at FW mid-termen, 3.0 mm on HW). Female: purple. Strictly montane habitat.","Arhopala baluensis":"Tailless. Bornean endemic. Smaller Bornean species (FW 18–20 mm). Male: dark purple-blue with a regular 0.5 mm border. Female: purple-blue with narrower-than-typical black borders. HW cilia in space 1a lacks a white spot (may be rarely present but obscure). Male valva unilobate; certain identification may require genitalia dissection.","Arhopala barami penanga":"One of two tailed exceptions in the otherwise-tailless agelastus group; relatively large for the group (FW 22.0–23.0 mm). Underside: HW postdiscal spot 6 widely out of line with spots 5 and 7 — inner edge of spot 6 in line with, or even further inward (basad) than, the inner edge of spot 7; spot 6 outwardly convex and typically touches or overlaps the end-cell bar. FW postdiscal band continuous; no costal spot in space 10; small spot often present at base of space 3; inner submarginal spots uniform in size and colour. [A. alesia sacharja](https://www.inaturalist.org/search?q=Arhopala+alesia) shares this exact spot-6/submarginal-spot pattern (per field-photo review, correcting older literature) — separate by size and border width: A. barami penanga is larger (FW 22.0–23.0 mm) with an exceptionally broad male border expanding from 2.5 mm at the tornus to 8.0 mm at the costa, vs. A. alesia sacharja's smaller size and more moderate border. Female: paler blue with similarly broad borders.","Arhopala bazaloides bazaloides":"Tailed. Underside: purple-brown with markings outlined by white striae; extra spot in mid-space 8 on HW underside (diagnostic for subgroup); NO spot at base of HW space 6 (unlike myrzala subgroup). Male: dark violet-blue with regular 2.0 mm black borders. Bazaloides subgroup.","Arhopala bazalus zalinda":"HW tail ~3 mm. Male: deep purple; FW black border 1.0 mm at apex decreasing to 1.5 mm at tornus. Underside purplish-brown with very dark markings; FW apex powdered with pale violet scales. Female: usually purple-blue.","Arhopala belphoebe cowani":"Tailless. FW postdiscal band incomplete, ending at vein 7. Underside hair-brown with markings narrowly outlined by pale buff lines; lacks a spot in the middle of HW space 8 and at the extreme base of HW space 6. Both sexes alike (monomorphic): broad dark borders (~5.0 mm at FW costa) and pale violet-blue upperside with a violet tinge. Camdeo subgroup. Very rare — no verified iNaturalist sightings; identify from this text key, not photos.","Arhopala borneensis":"Bornean taxon; underside pattern essentially matches [A. aurea](https://www.inaturalist.org/observations?verifiable=true&taxon_id=429759&preferred_place_id=6734). Underside hair-brown with complete markings; HW cell exceptionally long (more than half the wing length); FW postdiscal spots in spaces 2 and 3 wider than those above vein 4 (spot 3 especially wide); dark patch in FW space 1b not solid; HW postdiscal band only partially dislocated at vein 2. HW postdiscal spot 6 widely out of line with spots 5 and 7 — inner edge of spot 6 in line with, or even further inward (basad) than, the inner edge of spot 7; spot 6 touches or overlaps the end-cell bar. Short and stout tail at vein 2, just under 2.0 mm. Male: brassy green with strong blue suffusion at base; FW border thread throughout, widening almost imperceptibly toward tornus; HW green reaches termen narrowly in spaces 5 and 6 (unlike [A. aurea](https://www.inaturalist.org/observations?verifiable=true&taxon_id=429759&preferred_place_id=6734) where green does not reach termen). Female: blue with a black HW border reaching at least halfway to the end of the cell.","Arhopala buddha cooperi":"Tailed. Tail very short ~1.0 mm. Underside ground colour hair-brown; tornal green scales present and distinct. HW postdiscal spot 6 outwardly sinuous or concave; widely out of line with spots 5 and 7; touches or overlaps the end-cell bar. Costal spot present in FW underside space 10. FW postdiscal band weakly dislocated at vein 4; no spot at base of FW space 3. Male: shining violet-blue; black borders 1.0 mm wide. Female: may resemble female [A. aurea](https://www.inaturalist.org/observations?verifiable=true&taxon_id=429759&preferred_place_id=6734) but differs in narrower HW border and thinner tail.","Arhopala caeca":"Underside hair-brown with INCOMPLETE markings: FW lacks basal and central cell spots; HW lacks various basal and discal spots; postdiscal band narrow. Male: brilliant green turning to violet-blue at the tornus of both wings (diagnostic — unique in the group); FW border a thread. Short stumpy HW tail (~2 mm).","Arhopala camdana camdana":"Tailed. Long tail ~4–6 mm. Closely related to [A. opalina](https://www.inaturalist.org/observations?verifiable=true&taxon_id=994269&preferred_place_id=6734). Male: clear violet-blue. HW underside: postdiscal spot 6 is smaller than spot 7 (diagnostic vs [A. opalina](https://www.inaturalist.org/observations?verifiable=true&taxon_id=994269&preferred_place_id=6734)). FW ~21.0 mm (smaller than A. semperi russelli, ~28.0 mm). Camdeo subgroup.","Arhopala cardoni":"Tailless; evenly rounded HW tornus with no tooth or tail at vein 2. Underside markings small and macular (dot-like); no tornal green scales. Male: bright blue with violet tinge; FW border 2.0 mm at tornus expanding to 5.0 mm at apex. Female: purer blue with slightly wider black borders than the male.","Arhopala centaurus nakula":"Decisive character: FW cell spots outlined in distinctive greenish-silver lines on the underside — unique to this species in Peninsular Malaysia. FW postdiscal band continuous; a costal spot is present in FW space 10, above the end-cell bar. One of the largest Arhopala in the region (FW 28–29 mm). HW cell short (much less than half the wing); HW tailed; tornus rounded; tornal lobe vestigial or absent.\n\nTwo Peninsular subspecies: [A. c. nakula](https://www.inaturalist.org/observations?verifiable=true&taxon_id=146903&preferred_place_id=6734) (mainland, Langkawi, Singapore) and A. c. dixoni (Tioman Island only). Male: purplish blue, FW border reduced to a thread. Female: paler and more purple; FW border more intensely darkened over distal half of cell; moderately broad black borders.\n\nConfirmatory: non-Peninsular relatives share the silvery FW markings but are not recorded here — [A. araxes](https://www.inaturalist.org/search?q=Arhopala+araxes) (Sumatra–Sulawesi; distinct HW tornal lobe) and [A. amantes](https://www.inaturalist.org/search?q=Arhopala+amantes) (S. Myanmar; very broad black borders 3.0–5.0 mm widening toward apex).","Arhopala cleander aphadantas":"FW postdiscal band NOT dislocated at vein 4 (straight or only sinuous). Male: violet-blue with broad black borders. Large species (FW > 21 mm); conspicuously projecting HW tornal lobe. HW band completely dislocated at vein 2.","Arhopala corinda acestes":"Monotypic group. Filamentous HW tail ~3.5 mm. FW: pointed apex, straight termen. Underside: large purple-brown patch under FW cell (basal half of space 1b completely darkened); FW spot 4 shifted distad; no costal spot in FW space 10; ground colour sometimes glazed with purple wash. HW spot 6 outwardly convex or almost straight; band partially dislocated at vein 2. Male: deep violet or dark purple, very narrow border. Female: purple-blue. Subspecies: acestes (Malay Peninsula and Singapore), corestes (Langkawi).","Arhopala dajagaka":"Tailless. Bornean endemic. Larger Bornean species (FW 21–25 mm). Male: dark bluish-purple with a thin black border. Female: THICK black borders and noticeably darker venation across the wings (diagnostic). Male valva unilobate; certain identification may require genitalia dissection.","Arhopala delta":"Tailed — distinct tail at vein 2; the ONLY tailed member of the amphimuta subgroup (all others tailless). Male: deep violet with a narrow, regular black border. Underside: FW postdiscal band nearly completely dislocated at vein 4. HW postdiscal spots in spaces 6 and 7 more or less rounded; spots 5–7 in echelon (centres in straight line).","Arhopala democritus democritus":"Underside: dark chocolate-brown ground colour; markings outlined by prominent silvery-white striae and dots (more contrast than lycaenaria). Upperside: both male and female lighter and more silvery blue. Short HW tail ~1.5–2.0 mm. Distribution: central Myanmar to Kedawi; also recorded at Fraser's Hill.","Arhopala democritus lycaenaria":"Standard subspecies representing the democritus group in the Malay Peninsula proper. Underside: hair-brown ground colour; all markings outlined by pale buff striae (less contrast than democritus ssp., which has silvery-white striae and dots). Short HW tail 1.5–2.0 mm. Macular underside markings; FW spot 4 shifted distad; HW spot 6 outwardly concave; HW band widely dislocated at vein 2.","Arhopala denta":"Distinctive SHORT tail — only ~2.5 mm (others in the group have 3.5–4.0 mm). FW: basal spot present in space 10. Underside hair-brown with at most a slight pinkish glaze. Male: brilliant blue, black border reduced to a thread.","Arhopala dispar pendleburyi":"Tailed. Long tail ~4–6 mm. Distinctive for its extensively whitened underside ground colour (diagnostic). Male: pale blue with a thread-like border; FW cell-end also whitened. Camdeo subgroup.","Arhopala elizabethae":"Gap between outer and central spots in HW space 7 conspicuously whitened. Tornal green scales present; HW spot 6 normal (not reaching base of space). Upperside male: shining deep blue with borders slightly wider than [A. ariel](https://www.inaturalist.org/observations?verifiable=true&taxon_id=885911&preferred_place_id=6734); female similar to male.","Arhopala elopura":"Underside ground colour uniform hair brown; markings notably faint, barely darker than the ground colour (less contrasting than [A. pseudomuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498185&preferred_place_id=6734)). FW: costal spot in mid-space 11 above the central cell spot; postdiscal spot 4 shifted distad, out of line with spots 5 and 6; no spot at extreme base of space 10. HW: postdiscal band completely dislocated at vein 2; postdiscal space 6 partly fuscous; postdiscal spot 6 outwardly straight or convex — inner edge in line with or inside the inner edge of spot 7, touching or overlapping the end-cell bar; centres of spots 5, 6 and 7 widely out of line. Tail ~3.5–4.0 mm; FW 17.0–19.0 mm (smaller than A. arianaga, FW 21.0–22.0 mm). Male: shining blue; black border very narrow, thread-like to just under 0.5 mm at apex. Female: broader black borders; blue areas often a purer shade than in related species.","Arhopala epimete suedas":"Unique in the agelastus group: costal spot present in FW space 10. FW underside: lower portion of postdiscal band significantly wider than upper part. HW lacks tornal green scales. Both sexes alike: blue with broad FW borders (2.0 mm at tornus to 6.0 mm at costa). Blue on HW confined to the cell. Tailless.","Arhopala epimuta epiala":"Tailless. Male FW upperside: large circular discal patch similar to [A. atosia](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498181&preferred_place_id=6734), but distinguished by the complete absence of a hindwing tail.","Arhopala eumolphus maxwelli":"HW tail ~3 mm. Outer edge of HW postdiscal spot 6 outwardly concave (contrast: straight in [A. overdijkinki](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1390509&preferred_place_id=6734)). Markings broad. FW 21–23 mm. Male: brassy green; FW rounded; black border 2.0 mm at tornus decreasing to 1.0 mm at apex. Female: purple-blue; black border usually reaches apex of FW cell.","Arhopala evansi":"Alea subgroup. Distinctive underside: slatey pink glaze with striae that are whiter than in other alea subgroup members. Forewing postdiscal spots in spaces 2 and 3 are in echelon, upright, and larger than the spots immediately above them. Smaller species (FW < 21 mm).","Arhopala fulla intaca":"Tailless. FW ~18 mm. Instantly recognizable by the near-total absence of underside markings: postdiscal spots on both wings replaced by an obscure, diffuse streak; rectangular mark at the end of the forewing discal cell absent (may also be absent on HW); only a few obscure basal spots near HW base. Male: shining violet-blue with thread-width border. Female: deeper violet with broader borders. Wide distribution: Myanmar to Sundaland, Philippines, Moluccas, New Guinea.","Arhopala havilandi":"Underside pale slatey purple with contrasting reddish-brown markings. FW: no basal spot in space 10. Male: violet-blue, black border reduced to a thread. Tail ~3.5–4.0 mm.","Arhopala hellada ozana":"Tailed. Short tail ~2.5 mm. Underside spots indistinct. FW postdiscal spot in space 4 shifted distad (out of line with spots 5 and 6). Male: clear violet-blue with thread-like border. Camdeo subgroup.","Arhopala hellenore siroes":"Spot 6 outer edge outwardly concave. FW apex acute; termen straight or slightly concave. Male: brassy green; black border thread-width above vein 4. Malay Peninsula.","Arhopala horsfieldi basiviridis":"Spot 6 outer edge outwardly concave. Underside markings very broad. FW apex rounded. Male: brassy green; very broad black borders reaching cell on both wings.","Arhopala hypomuta hypomuta":"Tailless. FW ~19 mm. Key character: small spot at the extreme base of HW space 6 on the underside (usually present in Malayan specimens; often absent in Bornean/Sumatran material). Similar to amphimuta group but separated by this basal spot. Male: deep shining violet-blue with very narrow borders. Female: more purple-blue with broader borders.","Arhopala ijanensis":"Tailed. FW ~23 mm. HW cell about half wing length or longer. Underside: markings rather variegated; whitish streak from base of dorsum to apex on HW. Male: pale blue; FW costal border runs narrowly along costa to wing base (unique). Female: same but costal border much broader. More common in Kedah than elsewhere in the Peninsula.","Arhopala inornata inornata":"Tailless. FW ~21 mm. Very rounded HW tornus. Underside: no tornal green scales; HW postdiscal spot 6 placed immediately below spot 7. Male: bright violet-blue with border reduced to a thread. Female: bluer than male with exceptionally narrow borders (0.5 mm on HW).","Arhopala johoreana johoreana":"Tailed. Short tail. Similar to [A. belphoebe cowani](https://www.inaturalist.org/search?q=Arhopala+belphoebe) (incomplete FW postdiscal band) but possesses a short tail and is much darker violet-blue. Camdeo subgroup.","Arhopala kinabala":"Tailless. Underside ground colour dark brown with large, blackish-brown markings. FW space 11 has two spots; FW space 3 spot is elongate and touches the end-cell bar. HW postdiscal spot 6 is oval, significantly enlarged, and overlaps the end-cell bar. Rare; seldom found below 450 m elevation.","Arhopala kurzi":"Tailless; HW tornus very rounded. FW 18–22 mm. Male: rather dull purple-blue with a thread-like black border. Female: purple; HW border unusually variable — purple sometimes reaches termen between veins 2 and 5, other specimens almost confined to cell. Underside FW: markings variable; lower postdiscal band sometimes obsolete; when fully developed, spot in space 1b shifted inward, placed midway between end-cell bar and postdiscal spot in space 2. Underside HW: postdiscal band WIDELY dislocated at vein 2 (diagnostic for subgroup). Forest species, low to moderate elevations.","Arhopala labuana":"Male upperside: much darker violet than [A. agelastus](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1294319&preferred_place_id=6734), with narrower black borders. Female: dark blue. Tailless. Underside: HW postdiscal spot in space 3 is usually shifted well basad (inward), placing it significantly out of line with spots 2 and 4 — the primary diagnostic separating it from [A. agelastus](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1294319&preferred_place_id=6734), whose spot 3 sits almost in line with spots 2 and 4.","Arhopala lurida":"HW tail ~2.5 mm. Male FW upperside: border slightly expanding toward apex; discal patch smaller than in [A. atosia](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498181&preferred_place_id=6734), almost entirely confined to bases of spaces 2 and 3. Underside markings darker and more clearly defined than [A. atosia](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498181&preferred_place_id=6734).","Arhopala major major":"Tailless. Both sexes bluer than [A. amphimuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498183&preferred_place_id=6734) above. Male: FW black border expands from 2.0 mm at tornus to 3.0 mm at apex. Underside similar to [A. amphimuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498183&preferred_place_id=6734). HW cilia often prolonged into a short tooth at vein 2.","Arhopala metamuta metamuta":"⚠ Extremely rare — verify carefully before confirming this identification.\n\nTailless; evenly rounded HW tornus with no tooth or tail at vein 2. Striking upperside: male has a brilliant greenish-blue HW that contrasts strongly with the dark, shining violet-blue FW (1.5 mm border). FW postdiscal spots 2 and 3 are in line (perimuta subgroup). If any doubt remains about the contrasting HW colour, reconsider [A. antimuta antimuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498184&preferred_place_id=6734) (the far more abundant perimuta-subgroup species).","Arhopala milleri":"Alea subgroup. Larger than [A. sublustris](https://www.inaturalist.org/observations?verifiable=true&taxon_id=475916&preferred_place_id=6734) (but still FW < 21 mm). No costal spot in FW underside space 10 (present in A. sublustris — per field photo/plate review). Male: more matt indigo blue (not bright glistening) with a regular, thread-like border under 0.5 mm; blue upperside lacks a violet tinge, like [A. sublustris](https://www.inaturalist.org/observations?verifiable=true&taxon_id=475916&preferred_place_id=6734). Genitalia often needed for certain identification.","Arhopala moolaiana yajuna":"Tailless. Male: bright shining violet-blue with a thread-like black border; FW 18–22 mm. Female: blue colour reaches the HW termen or very nearly so — black border is extremely narrow or absent at the termen (diagnostic; unique in the amphimuta group). Underside markings very similar to [A. norda](https://www.inaturalist.org/observations?verifiable=true&taxon_id=887831&preferred_place_id=6734). HW postdiscal band only partially dislocated at vein 2. Range: Malay Peninsula and south Myanmar. (Feature Scoring: Q102 = 'No — HW band not strongly dislocated at vein 2'; the key tree reaches this species via Q101 'Yes — border thread-like' as a routing shortcut, bypassing Q102.)","Arhopala moorei busa":"Tailless. Male: both wings the same shade of blue in all lights — key distinction from [A. muta maranda](https://www.inaturalist.org/observations?verifiable=true&taxon_id=780491&preferred_place_id=6734), whose HW is slightly paler and brighter (FW 16.0–18.0 mm). Female: bluish purple with broad black borders (duller and more purple than [A. muta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=780491&preferred_place_id=6734)'s female). Underside: spots quadrate/banded; FW space 2 spot stepped toward termen; HW postdiscal band dislocated — inner edge of spot in space 2 in line with, or only slightly outside, the outer edge of spot 1b. HW cilia: white spot in space 1a absent (very rarely present but extremely obscure).","Arhopala muta maranda":"Tailless. Male: FW rather dark bright blue; HW slightly paler and more glistening — the two wings are NOT the same shade in all lights (FW 17.0–19.0 mm). FW black border expands from 1.0–1.5 mm at tornus to 1.5–2.0 mm at apex. Female: shining blue with only a slight purple tint, broad black borders. Underside: spots quadrate/banded; FW space 2 spot stepped toward termen; HW postdiscal band dislocated — inner edge of spot in space 2 in line with, or only slightly outside, the outer edge of spot 1b. HW cilia: white spot in space 1a absent.","Arhopala myrzala lammas":"Moderately large, tailed species (exact tail length not recorded in key). Underside: crimson-brown with markings outlined by white striae; spot always present at base of HW space 6; central and outer postdiscal spots in space 7 conjoined at their upper ends. Male: shining royal blue with narrow black borders. Myrzala subgroup.","Arhopala myrzalina":"Tailless. Underside: crimson-brown with markings outlined by white striae; spot at base of HW space 6; central and outer spots in HW space 7 conjoined at their upper ends; HW postdiscal spots 5, 6 and 7 more or less in line, spot 6 roughly level with spot 5 (cf. [A. antimuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498184&preferred_place_id=6734) — hair-brown ground colour, spot 6 widely out of line and overlapping the end-cell bar). Male: broad FW border expanding from 1.5 mm at tornus to 4.0 mm at costa. Myrzala subgroup.","Arhopala norda":"Tailless. Distinguished from [A. major](https://www.inaturalist.org/observations?verifiable=true&taxon_id=429756&preferred_place_id=6734) by the small white patch on the HW cilia just above the tornal lobe, and by less rounded (more angular) postdiscal spots on the underside Underside markings are essentially identical to [A. moolaiana yajuna](https://www.inaturalist.org/observations?verifiable=true&taxon_id=549326&preferred_place_id=6734); the two are separated only by the male upperside forewing border — broad and expanding to ~2–3 mm in norda, but reduced to a thread in moolaiana — so from an underside photo alone they cannot be reliably told apart.","Arhopala normani":"Alea subgroup. Wings shaped similarly to [A. sublustris](https://www.inaturalist.org/observations?verifiable=true&taxon_id=475916&preferred_place_id=6734) and [A. phanda](https://www.inaturalist.org/observations?verifiable=true&taxon_id=940969&preferred_place_id=6734). Underside postdiscal band placed close to the inner submarginal lunules on both wings (also seen in [A. phanda](https://www.inaturalist.org/observations?verifiable=true&taxon_id=940969&preferred_place_id=6734) — see Feature Scoring note below). Superficially similar to [A. sublustris ridleyi](https://www.inaturalist.org/observations?verifiable=true&taxon_id=475916&preferred_place_id=6734) but male is less shining and more violet, lacking the pure bright blue (no violet tinge) of [A. sublustris](https://www.inaturalist.org/observations?verifiable=true&taxon_id=475916&preferred_place_id=6734) and [A. milleri](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1340247&preferred_place_id=6734). Borders narrow. Genitalia often needed for certain identification. HW postdiscal spot 6 is usually not much narrower at the bottom than at the top and widely overlaps the end-cell bar (cf. [A. phaenops](https://www.inaturalist.org/observations?verifiable=true&taxon_id=887006&preferred_place_id=6734), where spot 6 usually does not overlap the bar; cf. [A. phanda](https://www.inaturalist.org/observations?verifiable=true&taxon_id=940969&preferred_place_id=6734), whose spot 6 is quadrate). (2026-06-24 fix: band-closeness and spot-6-vs-spot-5-placement are both underside-only characters and, together, uniquely identify normani at this point in the key — the spot-6-vs-spot-5 'No' branch now resolves directly here instead of falling through to the upperside border/colour questions, which previously made normani indistinguishable from sublustris/milleri without seeing the male upperside.)","Arhopala opalina azata":"Tailed. Long tail ~4–6 mm. FW postdiscal band complete, partially dislocated at vein 4 (spot 4 slightly shifted outward). Male: pale greyish-blue with a violet tinge, very narrow thread-like black border. Female: slightly deeper blue with broader borders. Underside: uniform grey-brown to hair brown; HW spots 5, 6 and 7 in echelon; spot 6 nearer to spot 5; spot 6 as large as or larger than spot 7. Restricted dark patch in FW space 1b bounded by a pale line; central spot in space 1b not unusually elongate (cf. [A. semperi russelli](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1148362&preferred_place_id=6734)). End-cell bar not often enlarged outwards at its lower end (cf. [A. semperi russelli](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1148362&preferred_place_id=6734)). HW cell approximately half the wing length or longer. FW 22–26 mm. Camdeo subgroup.","Arhopala overdijkinki unda":"HW tail 5.0 mm (longest in group). Outer edge of HW postdiscal spot 6 outwardly straight (contrast: concave in [A. eumolphus](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498188&preferred_place_id=6734)). FW 22 mm. Male: rich violet; FW black border 2.5 mm at tornus, expanding strongly to 7.0 mm at costa. Female: shining blue with evenly curved FW border.","Arhopala paraganesa mendava":"Montane species on the Malay Peninsula. Underside HW: roughly quadrate whitish area from mid-cell to costa; no tornal green scales. Upperside: bright pale blue with broad borders; male HW mostly fuscous; female with obscure whitish patch at FW end-cell.","Arhopala paralea":"Tail 2.5 mm. Underside ground colour pale purplish-brown; tornal green scales absent or vestigial. Male: violet-blue; FW border 2.0 mm at mid-costa, slightly increasing toward tornus and apex; HW border 2.5 mm. Montane on the Malay Peninsula.","Arhopala perimuta regina":"Tailless; evenly rounded HW tornus with no tooth or tail at vein 2. Easily recognized: HW underside has a prominent central yellowish discal area; markings generally obscure or ill-defined; tornal green scales completely absent. HW postdiscal spots 5, 6, and 7 in echelon (centres overlapping, in a straight line); spot 6 positioned nearer to spot 5 than to the end-cell bar. FW: postdiscal spots 2 and 3 in line (may be oblique); spot 4 shifted distad out of line with spots 5 and 6; dark area under the FW cell obscure, ill-defined, or absent; no spot at the extreme base of space 3.","Arhopala phaenops sandakani":"Alea subgroup. Similar to [A. selta selta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=880747&preferred_place_id=6734) (border expanding toward apex) but HW postdiscal spot 6 usually does NOT overlap the end-cell bar. Smaller species (FW < 21 mm).","Arhopala phanda phanda":"Alea subgroup. Underside postdiscal band placed very close to the inner submarginal lunules — a trait shared with [A. normani](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1340249&preferred_place_id=6734), but A. phanda differs in having HW postdiscal spot 6 quadrate (in normani, spot 6 is not much narrower at the bottom than at the top) and usually lacks a costal spot in FW space 10. Smaller species (FW < 21 mm).","Arhopala pseudomuta":"Underside hair-brown; markings hardly darker than ground colour. FW: basal spot in space 10 usually present but VARIABLE — may be absent in some specimens (per notebook); scored 'Yes' (present) here to match the common form. HW: postdiscal spot 6 directly below spot 7, touching/overlapping the end-cell bar; outer edge curved outward (convex) (per field-photo review — supersedes the earlier 'slightly oblique, does not overlap' literature description). Male: violet-blue with black border ~1.0 mm. Tail ~3.5–4.0 mm.","Arhopala sceva indra":"Tailless. A smaller species. HW underside postdiscal series is dislocated at vein 2 (distinctive within the amphimuta subgroup). Male: dark violet-blue.","Arhopala selta selta":"Alea subgroup. FW termen rounded. HW postdiscal spot 6 widely overlaps the end-cell bar — separates it from [A. phaenops](https://www.inaturalist.org/observations?verifiable=true&taxon_id=887006&preferred_place_id=6734), whose spot 6 usually does not, or only just, overlaps the end-cell bar. Costal spot present in FW underside space 10, matching A. sublustris ridleyi (absent in A. milleri). Male: violet-blue with border expanding toward the apex. Smaller species (FW < 21 mm).","Arhopala semperi russelli":"Tailed. Long tail ~4–6 mm. Large and very rare. Male: deep, dull bluish-purple; FW border expands to 1.25 mm at the apex. Female: purple, with a distinct whitish patch at the end of the cell. FW ~28.0 mm. Underside: HW postdiscal spot 6 smaller than spot 7; central spot in space 1b characteristically elongate; lower half of the end-cell bar enlarged outwards. Camdeo subgroup.\n\nFeature Scoring: the upperside colour/border check (q_camdeo_c5) may be unavailable, but the HW spot 6/7 size question above is answered \"Yes\" (spot 6 smaller than spot 7) as a routing shortcut — the key tree reaches [A. opalina azata](https://www.inaturalist.org/observations?verifiable=true&taxon_id=994269&preferred_place_id=6734) via \"No\" at that question, but A. semperi russelli genuinely shares the \"spot 6 smaller\" character with [A. camdana camdana](https://www.inaturalist.org/search?q=Arhopala+camdana).","Arhopala silhetensis adorea":"Tailed. Large species — FW 23–26 mm. Conspicuously projecting HW tornal lobe. HW postdiscal band completely dislocated at vein 2. HW postdiscal spots 6 and 7 are oblique — inner edge of spot 7 is well inside outer edge of spot 6. Spot 6 is displaced from the postdiscal row toward the end-cell bar — shifted past midway and touching (or overlapping) the end-cell bar; spots 5, 6 and 7 are widely out of line. Outer edge of spot 6 is sinuous and placed well inside the inner edge of spot 5. FW postdiscal band partially dislocated at vein 4; costal spot in space 10 usually present. Male: blue with FW black border just under 1.0 mm. Range: NE India and Myanmar south through Sundaland to the Philippines; throughout the Malay Peninsula and Singapore.","Arhopala similis":"Tailless. Superficially identical to [A. agesias](https://www.inaturalist.org/observations?verifiable=true&taxon_id=149210&preferred_place_id=6734) but uniquely lacks the postdiscal band on the FW underside. Status as a separate species (vs. dimorph of [A. agesias](https://www.inaturalist.org/observations?verifiable=true&taxon_id=149210&preferred_place_id=6734)) has been questioned, though female genitalia differ slightly.","Arhopala sintanga":"⚠ Extremely rare — no confirmed iNaturalist records. Verify carefully before confirming this identification.\n\nTwo subspecies:\n• [A. sintanga tani](https://www.inaturalist.org/search?q=Arhopala+sintanga) (Malay Peninsula): pale slatey purple underside with contrasting reddish-brown markings; deeper violet upperside. Distinguished from the similar [A. havilandi kota](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1168050&preferred_place_id=6734) by the spot at the extreme base of FW space 10 (havilandi lacks this spot).\n• [A. sintanga sintanga](https://www.inaturalist.org/search?q=Arhopala+sintanga) (Borneo): nominate subspecies; underside ground colour crimson (highly distinctive); wider black borders on upperside.\n\nUnderside characters (both subspecies): spot at extreme base of FW space 10; central spot in FW space 11; FW postdiscal spot 4 shifted distad; HW spot 6 touches or overlaps the end-cell bar; spots 5, 6 and 7 widely out of line; HW postdiscal band completely dislocated at vein 2. Tail 3.5–4.0 mm.","Arhopala stinga":"Underside glazed with a purple wash (exactly as in [A. trogon](https://www.inaturalist.org/observations?verifiable=true&taxon_id=447353&preferred_place_id=6734)). Male: green WITHOUT any basal blue suffusion (no blue at wing bases); FW border distinctively wide — 2.5–3.0 mm at tornus, decreasing to a thread near the apex (widest border in the group). Short stumpy HW tail just under 2 mm. HW cell notably long — exceeding half the total wing length. HW end-cell bar notably long; postdiscal spot 6 touches or overlaps the end-cell bar (spot 6 inner edge at or inside the inner edge of spot 7). Distribution: restricted to forest in Johor. Outside Johor, [A. trogon](https://www.inaturalist.org/observations?verifiable=true&taxon_id=447353&preferred_place_id=6734) (which occurs throughout the Peninsula) is far more likely; within Johor, both remain possible and upperside characters are needed to confirm.","Arhopala stubbsi":"Tailless. Male: rather dull bluish-purple with a broad, even ~2.0 mm black border — the widest border in the amphimuta subgroup. HW cilia often prolonged at vein 2.","Arhopala sublustris ridleyi":"Alea subgroup. Male: bright glistening blue with a regular, thread-like border under 0.5 mm, lacking a violet tinge. Brighter and more glistening than [A. normani](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1340249&preferred_place_id=6734). Costal spot present in FW underside space 10 (absent in A. milleri — per field photo/plate review). Smaller species (FW < 21 mm).","Arhopala tameanga":"HW tail ~3 mm. Spot 6 outer edge outwardly straight. Underside markings clearly defined. FW apex acute; termen straight. FW 27 mm. Male: blue/violet (not green).","Arhopala trogon":"Underside glazed with a purple wash. Male: brilliant brassy green with a strong blue suffusion at the wing bases; FW border a thread throughout; HW green usually reaches the termen in spaces 3, 4, or 5. Short stumpy HW tail (~2 mm). HW end-cell bar notably long; postdiscal spot 6 touches or overlaps the end-cell bar. Distribution: occurs throughout Peninsular Malaysia, including Johor. [A. stinga](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1394352&preferred_place_id=6734) is restricted to Johor forest — outside Johor, A. trogon is far more likely; within Johor, both remain possible and upperside characters are needed to confirm.","Arhopala tropaea":"Tailless. Very small species (FW 13.0–14.0 mm). Male: duller bluish-purple upperside (noticeably less bright than [A. muta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=780491&preferred_place_id=6734) or [A. moorei](https://www.inaturalist.org/observations?verifiable=true&taxon_id=780493&preferred_place_id=6734)). Underside: postdiscal spots quadrate/banded; FW space 2 spot stepped toward termen (muta subgroup).","Arhopala varro selama":"Tailed. Small species. Very short HW tail (~1.5 mm). Male: even, pale metallic silvery blue upperside. FW spot 4 in normal position (not shifted). Camdeo subgroup.","Arhopala vihara":"Tailed. FW 20–22 mm. FW underside spot 4 in line with spots 5–6 (distinguishes from eumolphus group where spot 4 is out of line); no costal spot in FW space 10. HW spot 6 rounded, more or less separated; HW band only partially dislocated at vein 2. Male: dark violet-blue; border slightly less than 1.0 mm. Female: bluer shade. Two ssp.: vihara on the peninsular mainland; hirava on Langkawi.","Arhopala wildeyana wildeyana":"Tailless. Male upperside: violet blue with broader borders than [A. labuana](https://www.inaturalist.org/search?q=Arhopala+labuana) or [A. agelastus](https://www.inaturalist.org/observations?verifiable=true&taxon_id=1294319&preferred_place_id=6734) — 2.0 mm at tornus to 5.0 mm at costa. Female: brighter and purer blue. Underside: HW postdiscal spots 5, 6 and 7 widely out of line; the inner edge of spot 6 is in line with, or even further inward (basad) than, the inner edge of spot 7; spot 6 is outwardly convex and typically touches or overlaps the end-cell bar. In HW underside spaces (2)3–5 the submarginal spots are prominently black and wedge-shaped (∧) — like A. alaconia media, but without that species’ thick pale postdiscal border. Agelastus group; HW postdiscal band only partially dislocated at vein 2; FW postdiscal band continuous.","Arhopala zambra zambra":"FW postdiscal band partially dislocated at vein 4. FW postdiscal spot 9 as wide as or wider than spot 6. Male: typically deep blue. Large species (FW > 21 mm); conspicuously projecting HW tornal lobe.","Arhopala zylda elioti":"Tailless. Male: shining blue with a slight violet tinge; border 1.0 mm; FW 16–17 mm. HW evenly rounded — no trace of a tooth at vein 2 ([A. amphimuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498183&preferred_place_id=6734) has a short tooth). Female: paler blue with exceptionally narrow black borders (the narrowest in the amphimuta subgroup). HW postdiscal band only partially dislocated at vein 2 (as in [A. amphimuta](https://www.inaturalist.org/observations?verifiable=true&taxon_id=498183&preferred_place_id=6734)). Malay Peninsula.","Ganesa group — ariel or elizabethae (unresolved)":"⚠ Cannot distinguish to species without male FW upperside. Both candidates share: tornal green scales, HW spot 6 normal (not reaching base of space).\n\n[A. ariel](https://www.inaturalist.org/observations?verifiable=true&taxon_id=885911&preferred_place_id=6734): male BLUISH-PURPLE, hardly shining; FW border 1.5 mm at tornus expanding to 4.0 mm at apex. Female bluer with broader borders than male.\n\n[A. elizabethae](https://www.inaturalist.org/search?q=Arhopala+elizabethae): male SHINING DEEP BLUE; borders slightly wider than ariel throughout. Female similar to male.\n\nInspect the upperside to confirm species.","Muta subgroup — moorei or muta maranda (unresolved)":"⚠ Cannot distinguish to species without male upperside.\n\n[A. moorei busa](https://www.inaturalist.org/observations?verifiable=true&taxon_id=780493&preferred_place_id=6734): FW and HW exactly the same shade of bright blue in all lights; female more purple with broader borders.\n\n[A. muta maranda](https://www.inaturalist.org/observations?verifiable=true&taxon_id=780491&preferred_place_id=6734): FW dark bright blue, HW slightly paler and more glistening; borders slightly broader than moorei.\n\nInspect the male upperside in multiple light angles to confirm species.","Muta subgroup — tropaea / moorei / muta (unresolved)":"⚠ Cannot distinguish to species without male upperside colour and size.\n\n[A. tropaea](https://www.inaturalist.org/observations?verifiable=true&taxon_id=785409&preferred_place_id=6734): notably small (FW 13.0–14.0 mm); male duller bluish-purple. Underside markings more quadrate.\n\n[A. moorei busa](https://www.inaturalist.org/observations?verifiable=true&taxon_id=780493&preferred_place_id=6734): larger (FW 16.0–18.0 mm); male bright blue; FW and HW same shade of blue in all lights.\n\n[A. muta maranda](https://www.inaturalist.org/observations?verifiable=true&taxon_id=780491&preferred_place_id=6734): larger (FW 17.0–19.0 mm); male bright blue; FW dark bright blue, HW slightly paler and more glistening; border slightly broader.\n\nInspect the male upperside to confirm species."};

// ── Theme toggle ──────────────────────────────────────────────────────────────
const root = document.documentElement;
const btn  = document.getElementById('theme-toggle');
let darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme() {
  root.dataset.theme = darkMode ? 'dark' : 'light';
  btn.textContent = darkMode ? 'Light' : 'Dark';
}
applyTheme();
btn.addEventListener('click', () => { darkMode = !darkMode; applyTheme(); });

// ── Species list ──────────────────────────────────────────────────────────────
const spList  = document.getElementById('species-list');
const spCount = document.getElementById('sp-count');
const search  = document.getElementById('search');
const tbody   = document.getElementById('feature-tbody');
const header  = document.getElementById('detail-header');
const tableW  = document.getElementById('table-wrap');

const species = Object.keys(DATA).sort();
let activeSpecies = null;

function renderSpeciesList(filter) {
  const f = (filter || '').toLowerCase();
  const visible = species.filter(s => s.toLowerCase().includes(f));
  spCount.textContent = visible.length + ' of ' + species.length;
  spList.innerHTML = '';
  for (const name of visible) {
    const hasOverrides = DATA[name].some(r => r.src === 'override');
    const li = document.createElement('div');
    li.className = 'sp-item' + (hasOverrides ? ' has-overrides' : '') + (name === activeSpecies ? ' active' : '');
    li.dataset.name = name;
    li.innerHTML = '<span class="sp-name">' + name + '</span><span class="sp-dot"></span>';
    li.addEventListener('click', () => selectSpecies(name));
    spList.appendChild(li);
  }
}

function selectSpecies(name) {
  activeSpecies = name;
  renderSpeciesList(search.value);
  const rows = DATA[name] || [];
  const note = NOTES[name] || '';
  const overrides = rows.filter(r => r.src === 'override').length;
  header.innerHTML =
    '<h2>' + name + '</h2>' +
    '<div class="detail-meta">' +
      '<span>' + rows.length + ' features</span>' +
      '<span>' + overrides + ' override' + (overrides !== 1 ? 's' : '') + '</span>' +
      '<div class="legend">' +
        '<span class="legend-item"><span class="legend-dot canonical"></span>Canonical</span>' +
        '<span class="legend-item"><span class="legend-dot override"></span>Override</span>' +
      '</div>' +
    '</div>' +
    (note ? '<div class="note-text">' + escHtml(note) + '</div>' : '');
  tbody.innerHTML = '';
  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.className = r.src === 'override' ? 'override' : '';
    tr.innerHTML =
      '<td class="qnum">Q' + r.qn + '</td>' +
      '<td class="qtext">' + escHtml(r.q) + '</td>' +
      '<td class="ans">'  + escHtml(r.c) + '</td>' +
      '<td><span class="src-tag ' + r.src + '">' + r.src + '</span></td>';
    tbody.appendChild(tr);
  }
  tableW.style.display = '';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

search.addEventListener('input', () => renderSpeciesList(search.value));
renderSpeciesList('');
</script>
</body>
</html>
